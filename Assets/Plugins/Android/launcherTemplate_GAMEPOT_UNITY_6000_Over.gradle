([rootProject] + (rootProject.subprojects as List)).each {
    ext {
        it.setProperty("android.useAndroidX", true)
        it.setProperty("android.enableJetifier", true)
    }
}
apply plugin: 'com.android.application'
apply from: 'setupSymbols.gradle'
apply from: '../shared/keepUnitySymbols.gradle'

dependencies {
    implementation project(':unityLibrary')
    implementation "androidx.multidex:multidex:2.0.1"
}

android {
    namespace "**NAMESPACE**"
    ndkPath "**NDKPATH**"
    ndkVersion "**NDKVERSION**"

    compileSdk **APIVERSION**
    buildToolsVersion "**BUILDTOOLS**"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    dexOptions {
		javaMaxHeapSize "4g"
	}
 
    packaging {
		exclude 'META-INF/maven/com.nhncorp.nelo2.android/nelo2-android-sdk/pom.properties'
		exclude 'META-INF/maven/com.nhncorp.nelo2.android/nelo2-android-sdk/pom.xml'
        exclude 'META-INF/proguard/androidx-annotations.pro'
    }

    defaultConfig {
        minSdk **MINSDK**
        targetSdk **TARGETSDK**
        applicationId "**APPLICATIONID**"
        ndk {
            abiFilters **ABIFILTERS**
            debugSymbolLevel **DEBUGSYMBOLLEVEL**
        }
        versionCode **VERSIONCODE**
        versionName "**VERSIONNAME**"
        multiDexEnabled true
        resValue "string", "gamepot_project_id", "" 									   // required
        resValue "string", "gamepot_api_url", "" 										   	 // required (공백값으로 유지해주세요.)
        resValue "string", "gamepot_dash_url", "" 										   // required (공백값으로 유지해주세요.)
        resValue "string", "gamepot_store", "google" 									 // required
        resValue "string", "gamepot_app_title","@string/app_name" 			  // required (fcm)
        resValue "string", "gamepot_push_default_channel","Default" 	 	  // required (fcm)
   		resValue "string", "facebook_app_id", "0" // optional (facebook)
        resValue "string", "fb_login_protocol_scheme", "fb0" // optional (facebook)
        resValue "string", "facebook_client_token", "0" // 페이스북 콘솔 > 앱 >  설정 > 고급 설정 > 클라이언트 토큰 optional (facebook)
    	resValue "string", "gamepot_naver_clientid", "" // optional (naver login)
        resValue "string", "gamepot_naver_secretid", "" // optional (naver login)
        resValue "string", "gamepot_gpg_id","" // optional (google play game)
    	resValue "string", "gamepot_line_channelid",""				 	// optional (Line 개발자 콘솔에서 획득)
    	resValue "string", "gamepot_twitter_consumerkey", ""					  // optional (Twitter 개발자 콘솔에서 획득) 
    	resValue "string", "gamepot_twitter_consumersecret", "" 				 // optional (Twitter 개발자 콘솔에서 획득)
    	resValue "string", "gamepot_elsa_projectid", ""								 	// optional (ncp elsa)
    }

    androidResources {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**SIGN**

    lint {
        abortOnError false
    }

    buildTypes {
        debug {
            minifyEnabled **MINIFY_DEBUG**
            proguardFiles getDefaultProguardFile('proguard-android.txt')**SIGNCONFIG**
            jniDebuggable true
        }
        release {
            minifyEnabled **MINIFY_RELEASE**
            proguardFiles getDefaultProguardFile('proguard-android.txt')**SIGNCONFIG**
        }
    }**PACKAGING****PLAY_ASSET_PACKS****SPLITS**
**BUILT_APK_LOCATION**
    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = false
        }
        abi {
            enableSplit = true
        }
        texture {
            enableSplit = true
        }
    }

	**GOOGLE_PLAY_DEPENDENCIES**
}**SPLITS_VERSION_CODE****LAUNCHER_SOURCE_BUILD_SETUP**
